name: edge

services:
  caddy:
    build: .
    image: edge-caddy:local
    restart: unless-stopped
    env_file: /srv/edge/.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/edge/data:/data
      - /srv/edge/config:/config
    networks:
      - edge

networks:
  edge:
    external: true
